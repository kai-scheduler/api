kind: Added
body: |-
  kubectl get columns for PodGroup (queue, min member, latest unschedulable reason, age; priority class and preemptibility in -o wide), Queue (GPU quota, allocated GPUs, over-quota weight), BindRequest (pod, node, phase, age; reason in -o wide) and Topology (highest and lowest level, age; all levels in -o wide)
